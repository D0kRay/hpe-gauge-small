name: Build ESP-IDF

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:release-v6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target
        run: idf.py set-target esp32s3

      - name: Build
        run: idf.py build
