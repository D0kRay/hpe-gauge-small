name: Build ESP-IDF

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:release-v6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target
        run: idf.py set-target esp32s3

      - name: Build
        run: idf.py build

      - name: Upload ESP-IDF build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-build
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json

  docs:
    name: Build MkDocs Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build docs site
        run: mkdocs build --strict

      - name: Upload wiki artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: site

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      image: espressif/idf:release-v6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Set target
        run: idf.py set-target esp32s3

      - name: Build
        run: idf.py build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
